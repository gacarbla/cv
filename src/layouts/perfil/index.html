<div class="layout layout-perfil">
  <div class="fondo-cv" aria-hidden="true"></div>
  <a class="saltar" href="#contenido-perfil" data-i18n="comun.saltar">Saltar al contenido</a>
  <header class="cabecera" data-cabecera>
    <div class="cabecera-in">
      <a class="marca" href="#/perfil" data-go="perfil">
        GACARBLA<span class="marca-punto">.</span>
      </a>
      <div class="acciones">
        <button class="icono" type="button" data-accion="tema" data-i18n-aria-label="comun.tema" aria-label="Cambiar tema"></button>
        <div class="idioma-menu" data-idioma-menu>
          <button class="idioma-boton" type="button" data-idioma-toggle aria-haspopup="listbox" aria-expanded="false" aria-label="Idioma">
            <span class="idioma-bandera" data-idioma-bandera aria-hidden="true"></span>
            <span class="idioma-codigo" data-idioma-codigo>ES</span>
            <span class="idioma-flecha" aria-hidden="true"></span>
          </button>
          <div class="idioma-lista" data-idioma-lista role="listbox" data-i18n-aria-label="comun.idioma" aria-label="Idioma" hidden></div>
        </div>
        <button class="icono" type="button" data-accion="salir" data-icono="log-out" data-i18n-aria-label="comun.salir" aria-label="Cerrar sesión"></button>
      </div>
    </div>
  </header>
  <main id="contenido-perfil" class="contenido-perfil" tabindex="-1"><page></page></main>
  <footer class="pie">
    <div class="pie-in">
      <p>
        © <span data-anio></span> Gabriel Carro Blanco.
        <span data-i18n="comun.piePrivado">Perfil privado</span>.
        <span data-i18n="comun.actualizado">Actualizado</span>
        <time data-campo="actualizado"></time>.
      </p>
    </div>
  </footer>
</div>
